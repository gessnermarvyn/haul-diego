<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated placeholder: two workers loading a dump truck in a sunny San Diego driveway">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8D4"/>
      <stop offset="38%" stop-color="#E7C588"/>
      <stop offset="72%" stop-color="#F4A15A"/>
      <stop offset="100%" stop-color="#E85A1A"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A52"/>
      <stop offset="100%" stop-color="#1A272D"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F27A3A"/>
      <stop offset="100%" stop-color="#D44712"/>
    </linearGradient>
  </defs>
  <rect width="800" height="700" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="640" cy="120" r="54" fill="#FFE08A" opacity=".9"/>
  <!-- distant hills -->
  <path d="M0 310 C80 280 140 300 220 270 C300 240 360 280 460 250 C560 220 640 260 800 230 V360 H0 Z" fill="#2E5B63" opacity=".35"/>
  <!-- house -->
  <path d="M430 300 l170 -80 170 80 v130 H430 Z" fill="#F3E4CF"/>
  <path d="M430 300 l170 -80 170 80 h-40 l-130 -62 -130 62 Z" fill="#6B3A2A"/>
  <rect x="500" y="340" width="48" height="70" fill="#7BA7B3"/>
  <rect x="600" y="340" width="48" height="70" fill="#7BA7B3"/>
  <rect x="545" y="370" width="36" height="60" fill="#3A2A22"/>
  <!-- palms -->
  <g fill="#1F5A3A">
    <rect x="118" y="250" width="10" height="160" fill="#6B4A28"/>
    <path d="M123 255 c-40 -10 -70 20 -80 40 30 -8 55 -6 80 -20z"/>
    <path d="M123 248 c-10 -40 20 -70 44 -80 -8 30 -6 55 -20 80z"/>
    <path d="M123 250 c40 -16 74 10 90 34 -28 -4 -54 0 -90 -18z"/>
    <path d="M123 255 c20 20 18 60 8 84 -14 -24 -16 -50 -8 -84z"/>
    <rect x="738" y="268" width="8" height="130" fill="#6B4A28"/>
    <path d="M742 270 c-36 -8 -62 16 -72 36 26 -6 48 -4 72 -18z"/>
    <path d="M742 264 c-6 -34 20 -60 40 -70 -8 26 -6 46 -18 70z"/>
    <path d="M742 266 c34 -12 64 10 78 30 -24 -4 -46 0 -78 -16z"/>
  </g>
  <!-- driveway -->
  <path d="M0 430 Q220 400 420 420 T800 400 V700 H0 Z" fill="#4A4F54"/>
  <path d="M0 430 Q220 400 420 420 T800 400 V470 Q500 450 0 490 Z" fill="#5A6066"/>
  <!-- dump truck -->
  <g transform="translate(40,300)">
    <!-- bed -->
    <path d="M40 150 l20 -90 h310 l10 90 H40 Z" fill="url(#truck)"/>
    <path d="M55 150 l16 -76 h290 l8 76 Z" fill="#2B3940"/>
    <!-- junk in bed -->
    <rect x="90" y="86" width="70" height="36" rx="3" fill="#8B5A3C"/>
    <rect x="150" y="70" width="90" height="28" rx="4" fill="#C4B39A"/>
    <rect x="200" y="92" width="50" height="32" rx="2" fill="#4E6B7A"/>
    <circle cx="260" cy="100" r="16" fill="#6E7C4A"/>
    <!-- frame -->
    <rect x="30" y="148" width="430" height="28" rx="3" fill="#1A2226"/>
    <!-- cab -->
    <path d="M370 148 h130 v-70 c0-18 -12-30 -30-30 H430 c-16 0-28 10-34 22 L370 148 Z" fill="url(#cab)"/>
    <path d="M430 62 h36 c14 0 24 8 28 22 l16 48 H400 Z" fill="#9FD2DC"/>
    <rect x="470" y="128" width="22" height="10" rx="2" fill="#F6D36A"/>
    <!-- wheels -->
    <circle cx="110" cy="186" r="32" fill="#1A1A1A"/>
    <circle cx="110" cy="186" r="16" fill="#C9C4BA"/>
    <circle cx="250" cy="186" r="32" fill="#1A1A1A"/>
    <circle cx="250" cy="186" r="16" fill="#C9C4BA"/>
    <circle cx="445" cy="186" r="32" fill="#1A1A1A"/>
    <circle cx="445" cy="186" r="16" fill="#C9C4BA"/>
  </g>
  <!-- workers -->
  <g transform="translate(500,390)">
    <!-- worker 1 carrying a chair-ish box -->
    <circle cx="46" cy="18" r="14" fill="#E8B896"/>
    <path d="M32 14 h28 v6 c-4 8-24 8-28 0z" fill="#2A2A2A"/>
    <rect x="28" y="34" width="36" height="44" rx="8" fill="#F1561A"/>
    <rect x="22" y="50" width="48" height="28" rx="3" fill="#C4B39A"/>
    <rect x="34" y="76" width="12" height="36" fill="#2C3A42"/>
    <rect x="50" y="76" width="12" height="36" fill="#2C3A42"/>
    <rect x="32" y="110" width="16" height="8" fill="#1A1A1A"/>
    <rect x="50" y="110" width="16" height="8" fill="#1A1A1A"/>
  </g>
  <g transform="translate(610,400)">
    <circle cx="40" cy="16" r="14" fill="#C48A62"/>
    <path d="M26 12 h28 v6 c-4 8-24 8-28 0z" fill="#1F1F1F"/>
    <rect x="22" y="32" width="36" height="46" rx="8" fill="#17303A"/>
    <rect x="16" y="54" width="22" height="10" rx="3" fill="#E8B896"/>
    <rect x="48" y="48" width="18" height="40" rx="3" fill="#8B5A3C"/>
    <rect x="28" y="76" width="12" height="34" fill="#2C3A42"/>
    <rect x="44" y="76" width="12" height="34" fill="#2C3A42"/>
    <rect x="26" y="108" width="16" height="8" fill="#1A1A1A"/>
    <rect x="44" y="108" width="16" height="8" fill="#1A1A1A"/>
  </g>
</svg>
